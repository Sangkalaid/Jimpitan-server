plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.kelurahan.bener.ronda'
    compileSdk 34

    defaultConfig {
        applicationId "id.kelurahan.bener.ronda"
        minSdk 26
        targetSdk 34
        versionCode 241
        versionName "2.4.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
}

tasks.register('syncWebAssets', Copy) {
    def webRoot = rootProject.projectDir.parentFile
    from(webRoot) {
        include 'index.html', 'manifest.json', 'sw.js', 'favicon.ico'
    }
    from(new File(webRoot, 'icons')) {
        into 'icons'
    }
    into layout.projectDirectory.dir('src/main/assets/www')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncWebAssets')
}
