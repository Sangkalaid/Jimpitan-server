plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'id.kelurahan.bener.ronda'
    compileSdk 34

    defaultConfig {
        applicationId "id.kelurahan.bener.ronda"
        minSdk 26
        targetSdk 34
        versionCode 300
        versionName "3.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storePassword System.getenv('ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv('ANDROID_KEYSTORE_PATH')) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
}

tasks.register('syncWebAssets', Copy) {
    def webRoot = rootProject.projectDir.parentFile
    from(webRoot) {
        include 'index.html', 'manifest.json', 'sw.js', 'favicon.ico', 'app.js', 'operations.js', 'app.css', 'app-config.js'
    }
    from(new File(webRoot, 'icons')) {
        into 'icons'
    }
    from(new File(webRoot, 'vendor')) {
        into 'vendor'
    }
    into layout.projectDirectory.dir('src/main/assets/www')
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('syncWebAssets')
}
